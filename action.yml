name: 'Agentchecker CI'
description: 'Detect and resolve contradictions between AI agent instruction files (AGENTS.md, CLAUDE.md, Cursor, Copilot)'
author: 'Moisés Valero'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  project-dir:
    description: 'Project directory to scan'
    required: false
    default: '.'
  local-only:
    description: 'Scan only local workspace files, skipping global home configs'
    required: false
    default: 'true'
  check-only:
    description: 'Exit with status 1 if contradictions exist (CI mode)'
    required: false
    default: 'true'
  audit-deps:
    description: 'Audit instruction rules against package.json dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run agentchecker
      shell: bash
      env:
        INPUT_CHECK_ONLY: ${{ inputs.check-only }}
        INPUT_LOCAL_ONLY: ${{ inputs.local-only }}
        INPUT_AUDIT_DEPS: ${{ inputs.audit-deps }}
        INPUT_PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        ARGS=()
        if [ "$INPUT_CHECK_ONLY" = "true" ]; then
          ARGS+=(--check-only)
        fi
        if [ "$INPUT_LOCAL_ONLY" = "true" ]; then
          ARGS+=(--local-only)
        fi
        if [ "$INPUT_AUDIT_DEPS" = "true" ]; then
          ARGS+=(--audit-deps)
        fi
        if [ -n "$INPUT_PROJECT_DIR" ] && [ "$INPUT_PROJECT_DIR" != "." ]; then
          ARGS+=(--project-dir "$INPUT_PROJECT_DIR")
        fi
        echo "Running: npx --yes agentchecker@latest ${ARGS[*]}"
        npx --yes agentchecker@latest "${ARGS[@]}"
